; PlatformIO Project Configuration
; ICRobot Open-Source — Arduino Uno R4 WiFi
;
; Build with: pio run
; Upload with: pio run --target upload
; Monitor: pio device monitor --baud 115200

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
build_flags = -I include
lib_deps =
    adafruit/Adafruit SH110X @ ^2.1.14
    adafruit/Adafruit QMC5883P Library @ ^1.0.2
    seeed-studio/Seeed Arduino LSM6DS3 @ ^2.0.5
